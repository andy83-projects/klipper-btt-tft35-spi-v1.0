# Experimental BTT TFT35-SPI V1.0, straight-through EXP1/EXP2 to Manta M5P.
# PREPARED ONLY. Do not include in the live config during a print.
# Requires klippy/extras/b1_panel.py on the host, then a supervised RESTART.
# Verify cable orientation, header identity, and conflicting pin use first.
# False deliberately prevents loading until the wiring review is complete.
[b1_panel]
wiring_verified: False
spi_bus: spi2
spi_speed: 2000000
cs_pin: EXP2_4
dc_pin: EXP2_7
other_cs_pins: EXP1_8, EXP1_4
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
# Landscape / BGR. Use 232 for the opposite landscape orientation.
madctl: 40
# Enable the status dashboard and encoder menu after installing the host helper.
status_menu: False
host_socket: /run/b1-panel/host.sock
# No reset or backlight pin. EXP2_8 is the printer MCU RESET line.
